<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Universal UI</title>
  <style>
    :root { color-scheme: light dark; }
    html, body { margin: 0; height: 100%; background: light-dark(#fff, rgb(18, 18, 20)); }
    #canvas { width: 100%; height: 100%; display: block; touch-action: none; }
    #playground-run { position: fixed; inset: 0; display: none; flex-direction: column; z-index: 1000;
      background: light-dark(#fff, rgb(18, 18, 20)); }
    #playground-run .run-bar { display: flex; align-items: center; justify-content: space-between;
      padding: 8px 12px; font: 13px -apple-system, system-ui, sans-serif; color: light-dark(#444, #bbb);
      background: light-dark(#f2f2f4, #1c1c1e); border-bottom: 1px solid light-dark(#ddd, #333); }
    #playground-run .run-stop { font: 13px -apple-system, system-ui, sans-serif; padding: 4px 12px; border-radius: 8px;
      border: none; background: #e0382f; color: #fff; cursor: pointer; }
    #playground-run .run-host { flex: 1; position: relative; overflow: hidden; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <script src="./runtime/react.production.min.js"></script>
  <script src="./runtime/react-dom.production.min.js"></script>
  <script type="module">
    import { boot } from "./runtime/boot.js";
    // The demo runs use the Playground's service builders (its bridge links
    // the platform services; the splash's own does not).
    import { Dependencies } from "./playground/app_bridge.js";
    import { createRunner } from "./playground/hot_runner.js";

    // The demos run with the same browser services the Playground gives a build.
    const networking = { async request(url, method) {
      const r = await fetch(url, { method: method || "GET" }); if (!r.ok) throw new Error(`HTTP ${r.status}`);
      return new Uint8Array(await r.arrayBuffer()); } };
    const prefix = "universalui.splash.";
    const b64 = (bytes) => { let s = ""; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(s); };
    const unb64 = (t) => Uint8Array.from(atob(t), (c) => c.charCodeAt(0));
    const runDependencies = {
      networking: Dependencies.networkService(() => networking),
      file: Dependencies.fileService(() => ({
        list(p) { const out = []; for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith(prefix + "file:" + (p ? p + "/" : ""))) out.push(k.slice((prefix + "file:").length)); } return out.sort(); },
        exists(p) { return localStorage.getItem(prefix + "file:" + p) !== null; },
        read(p) { const v = localStorage.getItem(prefix + "file:" + p); if (v === null) throw new Error("no such file: " + p); return unb64(v); },
        write(p, c) { try { localStorage.setItem(prefix + "file:" + p, b64(c)); return true; } catch (_) { return false; } },
        delete(p) { localStorage.removeItem(prefix + "file:" + p); return true; },
        url(p) { const v = localStorage.getItem(prefix + "file:" + p); return v === null ? "" : "data:application/octet-stream;base64," + v; },
      })),
      keychain: Dependencies.keychainService(() => ({
        async get(key) { const v = localStorage.getItem(prefix + "keychain:" + key); if (v === null) throw new Error("absent"); return unb64(v); },
        async set(value, key) { localStorage.setItem(prefix + "keychain:" + key, b64(value)); },
      })),
      analytics: Dependencies.analyticsService(() => ({ track(event) { console.log("[analytics]", event); } })),
      configuration: Dependencies.configurationService(() => ({ flag(key) { return key === "promo_banner"; } })),
    };
    const runner = createRunner({ dependencies: runDependencies });
    const demoFiles = { example_full: "example_full.wasm", tap_counter: "tap_counter_release.wasm", hot_demo: "hot_demo.wasm" };
    const bundles = new Map();

    // The splash's commands (Splash.swift → platformCommand("splash", …)).
    window.uuiPlatformCommand = async (key, value) => {
      if (key !== "splash") return;
      const command = value.split("#")[0];
      if (command === "playground") { location.href = "./playground/"; return; }
      if (command === "edit") { location.href = "./playground/?template=This%20website"; return; }
      if (command.startsWith("demo:")) {
        const file = demoFiles[command.slice(5)];
        if (!file) return;
        if (!bundles.has(file)) bundles.set(file, await (await fetch("./assets/" + file)).arrayBuffer());
        try { await runner.run(new Uint8Array(bundles.get(file))); }
        catch (error) { console.error("demo failed", error); }
      }
    };

    boot({ canvas: document.getElementById("canvas"), wasmURL: "./app.wasm", rendererName: "react", dependencies: {} })
      .catch((error) => { document.body.insertAdjacentHTML("beforeend", '<pre id="error"></pre>'); document.getElementById("error").textContent = String(error); });
  </script>
</body>
</html>
