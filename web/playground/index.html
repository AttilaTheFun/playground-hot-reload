<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Universal UI Playground</title>
  <style>
    :root { color-scheme: light dark; }
    html, body { margin: 0; height: 100%; background: light-dark(#fff, rgb(18, 18, 20)); overscroll-behavior: none; }
    #canvas { width: 100%; height: 100%; display: block; touch-action: none; }
    #error { font: 14px monospace; color: #b00; padding: 16px; white-space: pre-wrap; }
    /* The user's build, run full screen over the Playground. */
    #playground-run { position: fixed; inset: 0; display: none; flex-direction: column; z-index: 1000;
      background: light-dark(#fff, rgb(18, 18, 20)); }
    #playground-run .run-bar { display: flex; align-items: center; justify-content: space-between;
      padding: 8px 12px; font: 13px -apple-system, system-ui, sans-serif; color: light-dark(#444, #bbb);
      background: light-dark(#f2f2f4, #1c1c1e); border-bottom: 1px solid light-dark(#ddd, #333); }
    #playground-run .run-stop { font: 13px -apple-system, system-ui, sans-serif; padding: 4px 12px; border-radius: 8px;
      border: none; background: #e0382f; color: #fff; cursor: pointer; }
    #playground-run .run-host { flex: 1; position: relative; overflow: hidden; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <script src="./runtime/react.production.min.js"></script>
  <script src="./runtime/react-dom.production.min.js"></script>
  <script type="module">
    // Surface uncaught errors on the page (no devtools on a phone).
    const showError = (message) => {
      let box = document.getElementById("uui-error");
      if (!box) { box = document.createElement("pre"); box.id = "uui-error"; box.style.cssText = "position:fixed;left:8px;right:8px;bottom:8px;max-height:40%;overflow:auto;margin:0;padding:10px;font:12px monospace;color:#fff;background:#b00;border-radius:8px;z-index:2000;white-space:pre-wrap"; document.body.appendChild(box); }
      box.textContent += message + "\n";
    };
    window.addEventListener("error", (e) => showError((e.message || String(e.error)) + (e.error && e.error.stack ? "\n" + String(e.error.stack).split("\n").slice(0, 6).join("\n") : "")));
    window.addEventListener("unhandledrejection", (e) => showError("unhandled: " + (e.reason && e.reason.stack ? String(e.reason.stack).split("\n").slice(0, 6).join("\n") : String(e.reason))));
    import { boot } from "./runtime/boot.js";
    import { Dependencies } from "./app_bridge.js";
    import { createRunner } from "./hot_runner.js";

    // --- Platform services (docs/wasm_di.md): browser implementations ----
    const sandbox = "universalui.playground.";
    const toBase64 = (bytes) => { let s = ""; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(s); };
    const fromBase64 = (text) => Uint8Array.from(atob(text), (c) => c.charCodeAt(0));
    // Site assets (the sample templates) are readable as files under assets/.
    const servedCache = new Map();
    function servedGet(path, headOnly) {
      if (!path.startsWith("assets/")) return null;
      if (servedCache.has(path)) return headOnly ? true : servedCache.get(path);
      try {
        const xhr = new XMLHttpRequest();
        xhr.open("GET", "./" + path, false);
        xhr.overrideMimeType("text/plain; charset=x-user-defined");
        xhr.send(null);
        if (xhr.status !== 200) return null;
        const text = xhr.responseText, bytes = new Uint8Array(text.length);
        for (let i = 0; i < text.length; i++) bytes[i] = text.charCodeAt(i) & 0xff;
        servedCache.set(path, bytes);
        return headOnly ? true : bytes;
      } catch (_) { return null; }
    }
    const fileService = {
      list(path) {
        const prefix = sandbox + "file:" + (path ? path.replace(/\/+$/, "") + "/" : "");
        const names = [];
        for (let i = 0; i < localStorage.length; i++) {
          const key = localStorage.key(i);
          if (key && key.startsWith(prefix)) names.push(key.slice((sandbox + "file:").length));
        }
        return names.sort();
      },
      exists(path) { return localStorage.getItem(sandbox + "file:" + path) !== null || servedGet(path, true) !== null; },
      read(path) {
        const stored = localStorage.getItem(sandbox + "file:" + path);
        if (stored !== null) return fromBase64(stored);
        const served = servedGet(path, false);
        if (served === null) throw new Error("no such file: " + path);
        return served;
      },
      write(path, contents) { try { localStorage.setItem(sandbox + "file:" + path, toBase64(contents)); return true; } catch (_) { return false; } },
      delete(path) { localStorage.removeItem(sandbox + "file:" + path); return true; },
      url(path) {
        if (servedGet(path, true) !== null) return new URL("./" + path, location.href).href;
        const stored = localStorage.getItem(sandbox + "file:" + path);
        if (stored === null) return "";
        const ext = (path.split(".").pop() || "").toLowerCase();
        const mime = { jpg: "image/jpeg", jpeg: "image/jpeg", png: "image/png", gif: "image/gif", webp: "image/webp", svg: "image/svg+xml" }[ext] || "application/octet-stream";
        return "data:" + mime + ";base64," + stored;
      },
    };
    const networking = {
      async request(url, method) {
        const response = await fetch(url, { method: method || "GET" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return new Uint8Array(await response.arrayBuffer());
      },
    };
    const imagePicker = {
      pickImage(maxDimension) {
        return new Promise((resolve) => {
          const input = document.createElement("input");
          input.type = "file"; input.accept = "image/*"; input.style.display = "none";
          document.body.appendChild(input);
          const finish = (value) => { input.remove(); resolve(value); };
          input.onchange = () => {
            const file = input.files && input.files[0];
            if (!file) return finish("");
            const image = new Image();
            const objectURL = URL.createObjectURL(file);
            image.onload = () => {
              const scale = Math.min(1, maxDimension / Math.max(image.width, image.height));
              const canvas = document.createElement("canvas");
              canvas.width = Math.round(image.width * scale); canvas.height = Math.round(image.height * scale);
              canvas.getContext("2d").drawImage(image, 0, 0, canvas.width, canvas.height);
              canvas.toBlob((blob) => { URL.revokeObjectURL(objectURL); finish(blob ? URL.createObjectURL(blob) : ""); }, "image/jpeg", 0.85);
            };
            image.onerror = () => finish("");
            image.src = objectURL;
          };
          input.oncancel = () => finish("");
          input.click();
        });
      },
    };
    // The services the USER's build sees while it runs (same table).
    const runDependencies = {
      networking: Dependencies.networkService(() => networking),
      file: Dependencies.fileService(() => ({ ...fileService,
        // A build's sandbox is its own namespace.
        list: (p) => fileService.list("run/" + p).map((n) => n.replace(/^run\//, "")),
        exists: (p) => fileService.exists("run/" + p), read: (p) => fileService.read("run/" + p),
        write: (p, c) => fileService.write("run/" + p, c), delete: (p) => fileService.delete("run/" + p),
        url: (p) => fileService.url("run/" + p) })),
      keychain: Dependencies.keychainService(() => ({
        async get(key) { const v = localStorage.getItem(sandbox + "run-keychain:" + key); if (v === null) throw new Error("absent"); return fromBase64(v); },
        async set(value, key) { localStorage.setItem(sandbox + "run-keychain:" + key, toBase64(value)); },
      })),
      analytics: Dependencies.analyticsService(() => ({ track(event) { console.log("[analytics]", event); } })),
      configuration: Dependencies.configurationService(() => ({ flag(key) { return key === "promo_banner"; } })),
      imagePicker: Dependencies.imagePickerService(() => imagePicker),
    };

    // --- The Playground host service: compile (worker), run (overlay), chat ----
    const runner = createRunner({ dependencies: runDependencies });
    const worker = new Worker("./compiler_worker.js", { type: "module" });
    const pending = new Map();
    let nextID = 1;
    worker.onmessage = (event) => {
      const { id } = event.data;
      const entry = pending.get(id);
      if (!entry) return;
      pending.delete(id);
      entry(event.data);
    };
    const ask = (message) => new Promise((resolve) => { const id = nextID++; pending.set(id, resolve); worker.postMessage({ id, ...message }); });
    let lastBuild = null;
    let toolchainStatus = "probing…";
    ask({ probe: true }).then((r) => { toolchainStatus = r.status; });
    const keyName = sandbox + "openrouter-key";
    const host = {
      async compile(source) {
        const result = await ask({ source });
        if (result.ok) { lastBuild = result.wasm; return ""; }
        return result.diagnostics || "compile failed";
      },
      async run() {
        if (!lastBuild) throw new Error("no successful build yet");
        return runner.run(lastBuild);
      },
      stop() { runner.stop(); },
      logs() { return runner.logs(); },
      async chat(body) {
        const key = localStorage.getItem(keyName);
        if (!key) throw new Error("no OpenRouter key");
        const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
          method: "POST",
          headers: { "Authorization": "Bearer " + key, "Content-Type": "application/json",
            "HTTP-Referer": "https://github.com/AttilaTheFun/universal_ui", "X-Title": "Universal UI Playground (web)" },
          body,
        });
        return await response.text();
      },
      uiTree() { return runner.uiTree(); },
      async tap(target) { return runner.drive("tap", target); },
      async typeText(target, text) { return runner.drive("type", target, text); },
      async submit(target) { return runner.drive("submit", target); },
      async swipe(target, dx, dy) { return runner.drive("swipe", target, [dx, dy]); },
      hasKey() { return !!localStorage.getItem(keyName); },
      setKey(key) { if (key) localStorage.setItem(keyName, key); else localStorage.removeItem(keyName); },
      requestedTemplate() { return new URLSearchParams(location.search).get("template") || ""; },
      toolchainStatus() {
        return toolchainStatus === "wasm" ? "In-browser Swift toolchain (swift-frontend.wasm)"
          : toolchainStatus === "dev" ? "Dev compile server (host toolchain)"
          : "No compiler: " + toolchainStatus;
      },
    };

    // Dev hook: headless verification drives the host directly.
    window.__playgroundHost = host;
    const dependencies = {
      networking: Dependencies.networkService(() => networking),
      file: Dependencies.fileService(() => fileService),
      keychain: runDependencies.keychain,
      analytics: runDependencies.analytics,
      configuration: runDependencies.configuration,
      imagePicker: Dependencies.imagePickerService(() => imagePicker),
      host: Dependencies.playgroundHostService(() => host),
    };
    // The Playground is a React-renderer page (real DOM: text fields, scrolling).
    boot({ canvas: document.getElementById("canvas"), wasmURL: "./app.wasm", rendererName: "react", dependencies })
      .catch((error) => { document.body.insertAdjacentHTML("beforeend", '<pre id="error"></pre>'); document.getElementById("error").textContent = String(error); });
  </script>
</body>
</html>
